<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#a52f21"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>鸭大臣记账</title><meta name="description" content="账目留在手机，安心记下每一笔"><link rel="manifest" href="./manifest.webmanifest">
  <style>
    :root{--red:#ad3123;--ink:#2d2119;--muted:#88776a;--paper:#fffaf0;--line:#eadcc5}*{box-sizing:border-box}body{margin:0;background:#eee8db;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,select{font:inherit}.app{width:min(100%,480px);min-height:100dvh;margin:auto;padding:0 16px 90px;background:linear-gradient(#fff0bd,#fbf4e5 360px,#f8f3ea)}.hero{margin:0 -16px;padding:calc(18px + env(safe-area-inset-top)) 22px 50px;color:#fff8e8;background:linear-gradient(150deg,#852018,#c53d27 60%,#df6c34);border-radius:0 0 36px 36px}.top,.title,.section-title,.sum-foot{display:flex;justify-content:space-between;align-items:center}.top{font-size:12px}.title{margin-top:24px}.title small{display:block;color:#ffd38a;letter-spacing:.16em}.title h1{margin:3px 0;font:34px STKaiti,KaiTi,serif}.duck{display:grid;place-items:center;width:64px;height:64px;border:3px solid #f7c85f;border-radius:50%;background:#fff2cf;font-size:37px}.hero>p{max-width:320px;margin:16px 0 0;font:16px/1.6 STKaiti,KaiTi,serif}.card{margin-top:14px;padding:18px;border:1px solid var(--line);border-radius:20px;background:#fffdf8}.summary{position:relative;margin-top:-30px;box-shadow:0 12px 28px #6c451419}.summary>span,.sub{color:var(--muted);font-size:12px}.summary>strong{display:block;margin:5px 0 14px;font-size:32px}.sum-foot{padding-top:12px;border-top:1px dashed var(--line);font-size:13px}.sum-foot b,.expense{color:var(--red)}.quick h2,.card h2{margin:0;font-size:17px}.quick form{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}.quick input,.editor input,.editor select{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff}.primary{padding:0 18px;border:0;border-radius:12px;background:var(--red);color:#fff;font-weight:700}.message{margin:8px 0 0;color:var(--muted);font-size:11px}.section-title{margin:23px 2px 10px}.section-title h2{margin:0;font-size:18px}.list{display:grid;gap:9px}.row{display:flex;align-items:center;gap:10px;padding:13px;border:1px solid var(--line);border-radius:16px;background:#fff}.icon{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:#fff0c8}.copy{min-width:0;flex:1}.copy b,.copy span,.amount b,.amount span{display:block}.copy b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}.copy span,.amount span{margin-top:3px;color:var(--muted);font-size:10px}.amount{text-align:right}.income{color:#3e7b4a}.delete{width:25px;height:25px;border:0;border-radius:50%;background:#f4e5d8;color:#9b7163}.empty{padding:45px 10px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--ink);margin-top:8px}.page-head{padding:calc(24px + env(safe-area-inset-top)) 2px 6px}.page-head h1{margin:3px 0;font-size:28px}.page-head p{margin:0;color:var(--muted);font-size:12px}.add{float:right;margin-top:-45px;width:42px;height:42px;border:0;border-radius:14px;background:var(--red);color:#fff;font-size:25px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats b{display:block;margin-top:7px;font-size:18px}.bar{margin:14px 0}.bar label{display:flex;justify-content:space-between;font-size:12px}.track{height:9px;margin-top:6px;border-radius:9px;background:#eee2d3;overflow:hidden}.track i{display:block;height:100%;background:linear-gradient(90deg,var(--red),#e28a41)}.settings button,.upload{display:flex;width:100%;justify-content:center;margin-top:10px;padding:13px;border:0;border-radius:12px;background:var(--red);color:#fff;font-weight:700}.settings .soft,.upload{background:#f3e5d5;color:#714d39}.upload input{display:none}.nav{position:fixed;bottom:0;left:50%;display:grid;width:min(100%,480px);grid-template-columns:repeat(4,1fr);transform:translateX(-50%);padding:7px 10px max(8px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fffdf9ed;backdrop-filter:blur(16px)}.nav button{border:0;background:none;color:#8c7a6d;font-size:11px}.nav button b{display:block;font-size:20px}.nav .active{color:var(--red);font-weight:700}.modal{position:fixed;z-index:5;inset:0;display:none;align-items:flex-end;justify-content:center;padding:12px;background:#27140e77}.modal.show{display:flex}.editor{width:min(100%,460px);padding:18px;border-radius:25px 25px 16px 16px;background:var(--paper)}.editor-head{display:flex;justify-content:space-between;align-items:center}.editor-head h2{margin:0;font-size:17px}.link{border:0;background:none;color:var(--red);padding:8px}.switch{display:grid;grid-template-columns:1fr 1fr;margin:18px 0 12px;padding:3px;border-radius:12px;background:#ecdfcc}.switch button{padding:10px;border:0;border-radius:9px;background:none}.switch .active{background:var(--red);color:#fff}.editor label{display:grid;grid-template-columns:55px 1fr;align-items:center;gap:8px;margin-top:10px;color:var(--muted);font-size:13px}.editor .money{display:flex;justify-content:center;margin:15px}.money input{width:210px;border:0;background:transparent;text-align:center;font-size:38px;font-weight:800}.hidden{display:none!important}
    .quick-switch{display:grid;grid-template-columns:1fr 1fr;margin-top:12px;padding:3px;border-radius:11px;background:#eee2d1}.quick-switch button{padding:8px;border:0;border-radius:8px;background:transparent;color:var(--muted)}.quick-switch button.active{background:#fff;color:var(--red);font-weight:700;box-shadow:0 2px 8px #68431d18}.sum-foot span{flex:1}.sum-foot span:nth-child(2){text-align:center}.sum-foot span:last-child{text-align:right}.sum-foot b{display:block;margin-top:4px}.sum-foot .income{color:#3e7b4a}
  </style>
</head>
<body><main class="app">
  <section id="home"><header class="hero"><div class="top"><span>本地账本</span><span>● 仅此设备</span></div><div class="title"><div><small>今日账房</small><h1>鸭大臣 🪶</h1></div><button class="duck" onclick="openEditor()">🦆</button></div><p>主子吉祥。每一笔银钱，臣都替您妥帖记在这台手机里。</p></header><div class="card summary"><span>本月结余</span><strong id="monthBalance">¥0.00</strong><div class="sum-foot"><span>本月收入<b class="income" id="monthIncome">¥0.00</b></span><span>本月支出<b id="monthExpense">¥0.00</b></span><span>今日支出<b id="todayExpense">¥0.00</b></span></div></div><div class="card quick"><h2>一句话记账</h2><div class="quick-switch"><button id="quickExpense" class="active" onclick="setQuickType('expense')">记支出</button><button id="quickIncome" onclick="setQuickType('income')">记收入</button></div><form id="quickForm"><input id="quickInput" placeholder="例如：午饭 28 元"><button class="primary">记下</button></form><p class="message" id="message">当前记录支出 · 账目只保存在这台设备</p></div><div class="section-title"><h2>最近账单</h2><span class="sub" id="recentCount"></span></div><div id="recent"></div></section>
  <section id="entries" class="hidden"><header class="page-head"><p id="entryCount"></p><h1>账单明细</h1><button class="add" onclick="openEditor()">＋</button></header><div id="allEntries"></div></section>
  <section id="stats" class="hidden"><header class="page-head"><p id="monthLabel"></p><h1>本月统计</h1></header><div class="stats"><div class="card"><span class="sub">收入</span><b class="income" id="incomeTotal"></b></div><div class="card"><span class="sub">支出</span><b class="expense" id="expenseTotal"></b></div></div><div class="card"><h2>支出分类</h2><div id="chart"></div></div></section>
  <section id="settings" class="hidden"><header class="page-head"><p>数据管理</p><h1>我的账本</h1></header><div class="card"><h2>🦆 鸭大臣账本</h2><p class="sub" id="savedCount"></p></div><div class="card settings"><h2>备份与恢复</h2><p class="sub">清除 Safari 数据会删除账单，建议定期导出完整备份。</p><button onclick="exportJSON()">导出完整备份（JSON）</button><button class="soft" onclick="exportCSV()">导出表格（CSV）</button><label class="upload">从 JSON 恢复<input type="file" accept=".json,application/json" onchange="importJSON(event)"></label></div><div class="card"><b>🔒 隐私说明</b><p class="sub">没有账号和数据库服务器，账单不会上传到 GitHub。</p></div></section>
  <nav class="nav"><button class="active" data-tab="home"><b>⌂</b>首页</button><button data-tab="entries"><b>☷</b>明细</button><button data-tab="stats"><b>◔</b>统计</button><button data-tab="settings"><b>♙</b>我的</button></nav>
</main>
<div class="modal" id="modal"><form class="editor" id="editor"><div class="editor-head"><button type="button" class="link" onclick="closeEditor()">取消</button><h2 id="editorTitle">记一笔</h2><button class="link">保存</button></div><div class="switch"><button type="button" id="expenseBtn" class="active" onclick="setType('expense')">支出</button><button type="button" id="incomeBtn" onclick="setType('income')">收入</button></div><label class="money"><span>¥</span><input id="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required></label><label>分类<select id="category"></select></label><label>备注<input id="note" placeholder="这笔钱花在哪里"></label><label>账户<input id="account" value="默认账户"></label><label>日期<input id="date" type="date" required></label></form></div>
<script>
const KEY='duck-ledger-entries-v1',expenses=['餐饮','购物','交通','居住','娱乐','医疗','学习','人情','其他'],incomes=['工资','奖金','理财','红包','退款','其他'];let data=[],editing=null,type='expense',quickType='expense';const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('zh-CN',{style:'currency',currency:'CNY'}).format(n);
function load(){try{data=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{data=[]}data.sort((a,b)=>b.date.localeCompare(a.date));render()}function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function parse(t){const ms=[...t.replaceAll(',','').matchAll(/(?:¥|￥)?\s*(\d+(?:\.\d{1,2})?)\s*(?:元|块)?/g)],m=ms.at(-1);if(!m)return null;const amount=+m[1];if(!(amount>0))return null;const income=quickType==='income',rules=income?[['工资',['工资','薪水']],['奖金',['奖金']],['理财',['利息','分红']],['红包',['红包']],['退款',['退款','报销']]]:[['餐饮',['饭','早餐','午餐','晚餐','咖啡','奶茶','外卖']],['购物',['淘宝','京东','衣服','买了']],['交通',['打车','地铁','公交','加油']],['居住',['房租','水费','电费']],['娱乐',['电影','游戏','旅游','烟花']],['医疗',['医院','药']],['学习',['书','课程']]];const category=rules.find(r=>r[1].some(x=>t.includes(x)))?.[0]||'其他';return{amount,type:income?'income':'expense',category,note:t.replace(m[0],'').replace('收入','').trim()||category}}
function setQuickType(t){quickType=t;$('quickExpense').classList.toggle('active',t==='expense');$('quickIncome').classList.toggle('active',t==='income');$('quickInput').placeholder=t==='expense'?'例如：午饭 28 元':'例如：工资 5000 元';$('message').textContent=`当前记录${t==='expense'?'支出':'收入'} · 账目只保存在这台设备`}
function quick(e){e.preventDefault();const p=parse($('quickInput').value);if(!p){$('message').textContent='没有识别到金额，试试“午饭 28 元”';return}data.unshift({...p,id:crypto.randomUUID(),account:'默认账户',date:new Date().toISOString(),createdAt:new Date().toISOString()});$('quickInput').value='';$('message').textContent=`已记下：${p.note} ${money(p.amount)}`;save()}
function list(items){if(!items.length)return'<div class="card empty">📜<b>账本还是空的</b><span>记下第一笔，账房就开张了</span></div>';return`<div class="list">${items.map(e=>`<article class="row" onclick="openEditor('${e.id}')"><div class="icon">${e.type==='income'?'🪙':'🏮'}</div><div class="copy"><b>${esc(e.note||e.category)}</b><span>${esc(e.category)} · ${esc(e.account)}</span></div><div class="amount"><b class="${e.type}">${e.type==='expense'?'−':'+'}${money(e.amount)}</b><span>${new Date(e.date).toLocaleDateString('zh-CN',{month:'short',day:'numeric'})}</span></div><button class="delete" onclick="del(event,'${e.id}')">×</button></article>`).join('')}</div>`}
function render(){const now=new Date(),month=data.filter(e=>{const d=new Date(e.date);return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()}),out=month.filter(e=>e.type==='expense'),inc=month.filter(e=>e.type==='income'),sum=a=>a.reduce((s,e)=>s+e.amount,0),today=data.filter(e=>e.type==='expense'&&new Date(e.date).toDateString()===now.toDateString()),incomeSum=sum(inc),expenseSum=sum(out),balance=incomeSum-expenseSum;$('monthIncome').textContent=money(incomeSum);$('monthExpense').textContent=money(expenseSum);$('monthBalance').textContent=money(balance);$('monthBalance').className=balance>=0?'income':'expense';$('todayExpense').textContent=money(sum(today));$('recentCount').textContent=`${data.length} 笔`;$('recent').innerHTML=list(data.slice(0,5));$('entryCount').textContent=`共 ${data.length} 笔`;$('allEntries').innerHTML=list(data);$('monthLabel').textContent=now.toLocaleDateString('zh-CN',{year:'numeric',month:'long'});$('incomeTotal').textContent=money(incomeSum);$('expenseTotal').textContent=money(expenseSum);$('savedCount').textContent=`已在本机保存 ${data.length} 笔账单`;const sums={};out.forEach(e=>sums[e.category]=(sums[e.category]||0)+e.amount);const rows=Object.entries(sums).sort((a,b)=>b[1]-a[1]),max=rows[0]?.[1]||1;$('chart').innerHTML=rows.length?rows.map(([n,v])=>`<div class="bar"><label><b>${n}</b><span>${money(v)}</span></label><div class="track"><i style="width:${Math.max(8,v/max*100)}%"></i></div></div>`).join(''):'<div class="empty">本月还没有支出</div>'}
function setType(t){type=t;$('expenseBtn').classList.toggle('active',t==='expense');$('incomeBtn').classList.toggle('active',t==='income');$('category').innerHTML=(t==='expense'?expenses:incomes).map(x=>`<option>${x}</option>`).join('')}
function openEditor(id){editing=id?data.find(e=>e.id===id):null;setType(editing?.type||'expense');$('editorTitle').textContent=editing?'编辑账单':'记一笔';$('amount').value=editing?.amount||'';$('category').value=editing?.category||(type==='expense'?'餐饮':'工资');$('note').value=editing?.note||'';$('account').value=editing?.account||'默认账户';$('date').value=(editing?.date||new Date().toISOString()).slice(0,10);$('modal').classList.add('show')}
function closeEditor(){$('modal').classList.remove('show')}function submit(e){e.preventDefault();const row={id:editing?.id||crypto.randomUUID(),amount:+$('amount').value,type,category:$('category').value,note:$('note').value.trim()||$('category').value,account:$('account').value.trim()||'默认账户',date:new Date($('date').value+'T12:00:00').toISOString(),createdAt:editing?.createdAt||new Date().toISOString()};data=editing?data.map(x=>x.id===row.id?row:x):[row,...data];save();closeEditor()}function del(e,id){e.stopPropagation();if(confirm('确定删除这笔账单吗？')){data=data.filter(x=>x.id!==id);save()}}
function download(n,c,t){const u=URL.createObjectURL(new Blob([c],{type:t})),a=document.createElement('a');a.href=u;a.download=n;a.click();URL.revokeObjectURL(u)}function exportJSON(){download(`鸭大臣备份-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify({version:1,entries:data},null,2),'application/json')}function exportCSV(){const q=v=>`"${String(v).replaceAll('"','""')}"`,r=[['日期','类型','分类','金额','备注','账户'],...data.map(e=>[e.date.slice(0,10),e.type==='expense'?'支出':'收入',e.category,e.amount,e.note,e.account])];download('鸭大臣账单.csv','\ufeff'+r.map(x=>x.map(q).join(',')).join('\n'),'text/csv')}async function importJSON(e){try{const j=JSON.parse(await e.target.files[0].text());if(!Array.isArray(j.entries))throw 0;data=j.entries;save();alert(`已恢复 ${data.length} 笔账单`)}catch{alert('无法识别备份文件')}e.target.value=''}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('quickForm').addEventListener('submit',quick);$('editor').addEventListener('submit',submit);document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('main>section').forEach(s=>s.classList.add('hidden'));$(b.dataset.tab).classList.remove('hidden');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');scrollTo(0,0)});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');load();
</script></body></html>
